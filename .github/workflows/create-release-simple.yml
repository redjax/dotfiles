---
name: Create Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          set -euo pipefail

          git fetch --tags

          LATEST_TAG=$(
            git tag --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump_version
        run: |
          LATEST="${{ steps.get_tag.outputs.latest_tag }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

          BUMP="${{ github.event.inputs.bump }}"
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="$MAJOR.$MINOR.$PATCH"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04

          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm

          - os: darwin
            arch: amd64
            runner: macos-15-intel

          - os: darwin
            arch: arm64
            runner: macos-15

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download chezmoi
        env:
          # renovate: datasource=github-releases depName=twpayne/chezmoi
          CHEZMOI_VERSION: v2.72.2
        run: |
          set -euo pipefail

          CHEZMOI_OS="${{ matrix.os }}"
          CHEZMOI_ARCH="${{ matrix.arch }}"

          ARCHIVE="chezmoi_${CHEZMOI_VERSION#v}_${CHEZMOI_OS}_${CHEZMOI_ARCH}.tar.gz"
          URL="https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/${ARCHIVE}"

          echo "Downloading chezmoi ${CHEZMOI_VERSION}"
          echo "URL: ${URL}"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            --output "$RUNNER_TEMP/$ARCHIVE" \
            "$URL"

          mkdir -p "$RUNNER_TEMP/chezmoi"

          tar \
            --extract \
            --gzip \
            --file "$RUNNER_TEMP/$ARCHIVE" \
            --directory "$RUNNER_TEMP/chezmoi"

          chmod +x "$RUNNER_TEMP/chezmoi/chezmoi"

          "$RUNNER_TEMP/chezmoi/chezmoi" --version

      - name: Create render environment
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/rendered-home"
          mkdir -p "$RUNNER_TEMP/chezmoi-source"

          cp -R home/. "$RUNNER_TEMP/chezmoi-source/"

      - name: Render dotfiles
        env:
          HOME: ${{ runner.temp }}/rendered-home
        run: |
          set -euo pipefail

          CHEZMOI="$RUNNER_TEMP/chezmoi/chezmoi"
          SOURCE="$RUNNER_TEMP/chezmoi-source"

          echo "+------------------+"
          echo "Runner Config"
          echo "+------------------+"
          echo "OS:   $(uname -s)"
          echo "Arch: $(uname -m)"
          echo

          echo "+------------------+"
          echo "Chezmoi"
          echo "+------------------+"

          "$CHEZMOI" --version
          echo

          echo "chezmoi.os: " $()"$CHEZMOI" execute-template '{{ .chezmoi.os }}')

          echo "chezmoi.arch: " $("$CHEZMOI" execute-template '{{ .chezmoi.arch }}')
          echo

          echo "+------------------+"
          echo "Initializing source"
          echo "+------------------+"

          "$CHEZMOI" init \
            --source "$SOURCE" \
            --destination "$HOME"

          echo
          echo "+------------------+"
          echo "Rendering dotfiles"
          echo "+------------------+"

          "$CHEZMOI" apply \
            --destination "$HOME" \
            --exclude=scripts \
            --verbose

      - name: Verify rendered files
        env:
          HOME: ${{ runner.temp }}/rendered-home
        run: |
          set -euo pipefail

          echo "Rendered home:"
          find "$HOME" -print | sort

          echo
          echo "Checking for unrendered chezmoi templates"

          if grep -R -n '{{' "$HOME" \
              --exclude-dir=.git \
              2>/dev/null; then
            echo "ERROR: Found possible unrendered template expressions."
            exit 1
          fi

          echo "No obvious unrendered templates found."

      - name: Create archives
        env:
          HOME: ${{ runner.temp }}/rendered-home
        run: |
          set -euo pipefail

          VERSION="${{ needs.setup.outputs.new_tag }}"
          OS_ARCH="${{ matrix.os }}-${{ matrix.arch }}"

          cd "$HOME"

          echo "Creating ZIP"
          zip -r \
            "$GITHUB_WORKSPACE/dotfiles-${OS_ARCH}-v${VERSION}.zip" \
            .

          echo "Creating TAR.GZ"
          tar \
            -czf \
            "$GITHUB_WORKSPACE/dotfiles-${OS_ARCH}-v${VERSION}.tar.gz" \
            .

          echo
          echo "Created:"
          ls -lh \
            "$GITHUB_WORKSPACE/dotfiles-${OS_ARCH}-v${VERSION}.zip" \
            "$GITHUB_WORKSPACE/dotfiles-${OS_ARCH}-v${VERSION}.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.zip
            *.tar.gz

  release:
    needs:
      - build
      - setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.setup.outputs.new_tag }}
          name: v${{ needs.setup.outputs.new_tag }}
          generate_release_notes: true
          files: artifacts/*
