---
name: Create Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          set -euo pipefail

          git fetch --tags

          LATEST_TAG=$(
            git tag --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump_version
        run: |
          LATEST="${{ steps.get_tag.outputs.latest_tag }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

          BUMP="${{ github.event.inputs.bump }}"
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="$MAJOR.$MINOR.$PATCH"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create release directory
        run: |
          mkdir -p release/
          mkdir -p temp_chezmoi/

      - name: Download chezmoi binary
        env:
          # renovate: datasource=github-releases depName=twpayne/chezmoi
          CHEZMOI_VERSION: v2.72.2
        run: |
          set -euo pipefail

          CHEZMOI_OS="${{ matrix.os }}"
          CHEZMOI_ARCH="${{ matrix.arch }}"

          ARCHIVE="chezmoi_${CHEZMOI_VERSION#v}_${CHEZMOI_OS}_${CHEZMOI_ARCH}.tar.gz"
          URL="https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/${ARCHIVE}"

          echo "Downloading chezmoi ${CHEZMOI_VERSION}"
          echo "URL: ${URL}"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            --output "temp_chezmoi/${ARCHIVE}" \
            "$URL"

          tar \
            --extract \
            --gzip \
            --file "temp_chezmoi/${ARCHIVE}" \
            --directory temp_chezmoi

          test -f temp_chezmoi/chezmoi

          mv temp_chezmoi/chezmoi release/chezmoi
          chmod +x release/chezmoi

      - name: Copy dotfiles templates
        run: |
          # Copy the home directory (contains all templates)
          cp -r home/ release/dotfiles/

          # Copy any additional config files users might need
          cp .chezmoidata.yml release/ 2>/dev/null || echo ".chezmoidata.yml not found, skipping"

      - name: Create installation script
        run: |
          cat <<'EOF' > release/install.sh
          #!/bin/bash
          set -euo pipefail

          echo "Installing dotfiles with bundled chezmoi"
          echo ""
          echo "IMPORTANT: This will modify your home directory dotfiles!"
          echo "Make sure you have backed up any existing dotfiles you want to keep."
          echo ""

          read -p "Do you want to continue? (y/N): " -n 1 -r
          echo

          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
              echo "Installation cancelled."
              exit 0
          fi

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          CHEZMOI_BIN="$SCRIPT_DIR/chezmoi"
          DOTFILES_DIR="$SCRIPT_DIR/dotfiles"
          CHEZMOI_SOURCE="$HOME/.local/share/chezmoi"

          chmod +x "$CHEZMOI_BIN"

          if [ ! -x "$CHEZMOI_BIN" ]; then
              echo "Error: chezmoi binary not found or not executable."
              exit 1
          fi

          if [ ! -d "$DOTFILES_DIR" ]; then
              echo "Error: dotfiles directory not found."
              exit 1
          fi

          if [ -d "$CHEZMOI_SOURCE" ]; then
              BACKUP_DIR="$HOME/.local/share/chezmoi.backup.$(date +%Y%m%d-%H%M%S)"

              echo ""
              echo "Existing chezmoi source found."
              echo "Backing it up to:"
              echo "  $BACKUP_DIR"

              mv "$CHEZMOI_SOURCE" "$BACKUP_DIR"
          fi

          echo ""
          echo "Initializing chezmoi"
          "$CHEZMOI_BIN" init --source "$DOTFILES_DIR"

          echo ""
          echo "The following changes will be applied:"
          echo ""
          "$CHEZMOI_BIN" diff
          echo ""

          read -p "Apply these changes? (y/N): " -n 1 -r
          echo

          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
              echo "Installation cancelled."
              echo ""
              echo "Your previous chezmoi source was backed up if one existed."
              exit 0
          fi

          echo "Applying dotfiles"
          "$CHEZMOI_BIN" apply --verbose

          echo ""
          echo "Installation complete!"
          echo "You may need to restart your shell or run 'exec \$SHELL' to load the new configuration."

      - name: Create README for release
        run: |
          cat <<EOF > release/README.txt
          # Dotfiles with Bundled Chezmoi

          This archive contains:
          - chezmoi binary (for ${{ matrix.os }}/${{ matrix.arch }})
          - dotfiles templates
          - install.sh script for easy installation

          ## Installation

          1. Extract this archive to a temporary directory
          2. Run: ./install.sh
          3. Follow the prompts

          ## Manual Installation

          If you prefer to install manually:

          1. Make chezmoi executable: chmod +x chezmoi
          2. Initialize chezmoi: ./chezmoi init --source dotfiles/
          3. Review what will be changed: ./chezmoi diff
          4. Apply the dotfiles: ./chezmoi apply

          ## Source

          GitHub: https://github.com/redjax/dotfiles
          EOF

      - name: Create archives
        run: |
          VERSION="${{ needs.setup.outputs.new_tag }}"
          OS_ARCH="${{ matrix.os }}-${{ matrix.arch }}"

          # Create deploy directory and move release contents into it
          mkdir -p deploy/
          mv release/* deploy/

          # Create ZIP archive
          zip -r "dotfiles-${OS_ARCH}-v${VERSION}.zip" deploy/

          # Create TAR.GZ archive
          tar -czf "dotfiles-${OS_ARCH}-v${VERSION}.tar.gz" deploy/

      - name: Validate release
        run: |
          set -euo pipefail

          test -x deploy/chezmoi
          test -x deploy/install.sh
          test -d deploy/dotfiles

          echo "Release contents:"
          find deploy -maxdepth 3 -type f -print | sort

          echo ""
          echo "Chezmoi version:"
          deploy/chezmoi --version

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.zip
            *.tar.gz

  release:
    needs:
      - build
      - setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.setup.outputs.new_tag }}
          name: v${{ needs.setup.outputs.new_tag }}
          generate_release_notes: true
          files: artifacts/*
