---
name: Create Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  setup:
    name: Determine release version
    runs-on: ubuntu-latest

    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags

          LATEST_TAG="$(
            git tag --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1
          )"

          if [[ -z "${LATEST_TAG}" ]]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "Latest tag: ${LATEST_TAG}"
          echo "latest_tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Bump version
        id: bump_version
        shell: bash
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"

          case "${BUMP}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "::error::Invalid version bump: ${BUMP}"
              exit 1
              ;;
          esac

          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"

          echo "New release version: ${NEW_TAG}"
          echo "new_tag=${NEW_TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      ##########################################################################
      # Prepare directories
      ##########################################################################

      - name: Create release directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/dotfiles
          mkdir -p temp_chezmoi

      ##########################################################################
      # Download the target-platform chezmoi binary
      ##########################################################################

      - name: Download chezmoi binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHEZMOI_OS: ${{ matrix.os }}
          CHEZMOI_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          CHEZMOI_VERSION="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/twpayne/chezmoi/releases/latest |
              jq -r '.tag_name'
          )"

          echo "Latest chezmoi version: ${CHEZMOI_VERSION}"

          if [[ -z "${CHEZMOI_VERSION}" || "${CHEZMOI_VERSION}" == "null" ]]; then
            echo "::error::Failed to determine latest chezmoi version."
            exit 1
          fi

          CHEZMOI_URL="https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION#v}_${CHEZMOI_OS}_${CHEZMOI_ARCH}.tar.gz"

          echo "Downloading chezmoi from:"
          echo "${CHEZMOI_URL}"

          curl \
            --fail \
            --location \
            "${CHEZMOI_URL}" |
            tar -xz -C temp_chezmoi

          mv temp_chezmoi/chezmoi release/chezmoi

          chmod +x release/chezmoi

          release/chezmoi --version

      ##########################################################################
      # Render the chezmoi source
      #
      # The repository contains .tmpl files. We render them into
      # release/dotfiles so that everything below this point operates on the
      # actual files users will receive.
      ##########################################################################

      - name: Render chezmoi files
        shell: bash
        run: |
          set -euo pipefail

          echo "Rendering chezmoi source into release/dotfiles..."

          ./release/chezmoi init \
            --source="${GITHUB_WORKSPACE}/home" \
            --destination="${GITHUB_WORKSPACE}/release/dotfiles"

          ./release/chezmoi execute-template \
            --init \
            </dev/null >/dev/null 2>&1 || true

      ##########################################################################
      # Format rendered shell files
      #
      # This uses the existing repository script and:
      #
      #   .config/shellfmt/options
      #
      # It operates ONLY on the rendered files in release/dotfiles.
      ##########################################################################

      - name: Install shellfmt
        shell: bash
        run: |
          set -euo pipefail

          SHELLFMT_VERSION="3.10.0"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/mvdan/sh/releases/download/v${SHELLFMT_VERSION}/shfmt_v${SHELLFMT_VERSION}_linux_amd64" \
            --output "${RUNNER_TEMP}/shellfmt"

          chmod +x "${RUNNER_TEMP}/shellfmt"

          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

          "${RUNNER_TEMP}/shellfmt" --version

      - name: Format rendered shell files
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/codeql/shellfmt_rendered_scripts.sh \
            "${GITHUB_WORKSPACE}/release/dotfiles"

      ##########################################################################
      # Copy release metadata/configuration
      ##########################################################################

      - name: Copy dotfiles release metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ".chezmoidata.yml" ]]; then
            cp ".chezmoidata.yml" "release/.chezmoidata.yml"
          else
            echo "[INFO] .chezmoidata.yml not found, skipping."
          fi

      ##########################################################################
      # Create installer
      ##########################################################################

      - name: Create installation script
        shell: bash
        run: |
          set -euo pipefail

          cat <<'EOF' > release/install.sh
          #!/bin/bash
          set -e

          echo "Installing dotfiles with bundled chezmoi..."
          echo ""
          echo "IMPORTANT: This will modify your home directory dotfiles!"
          echo "Make sure you have backed up any existing dotfiles you want to keep."
          echo ""
          read -p "Do you want to continue? (y/N): " -n 1 -r
          echo
          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
              echo "Installation cancelled."
              exit 1
          fi

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          CHEZMOI_BIN="$SCRIPT_DIR/chezmoi"
          DOTFILES_DIR="$SCRIPT_DIR/dotfiles"

          chmod +x "$CHEZMOI_BIN"

          if [ -d "$HOME/.local/share/chezmoi" ]; then
              echo "Existing chezmoi source found. Backing up to ~/.local/share/chezmoi.backup"
              mv "$HOME/.local/share/chezmoi" "$HOME/.local/share/chezmoi.backup"
          fi

          echo "Initializing chezmoi..."
          "$CHEZMOI_BIN" init --source "$DOTFILES_DIR"

          echo "Applying dotfiles..."
          "$CHEZMOI_BIN" apply --verbose

          echo ""
          echo "Installation complete!"
          echo "You may need to restart your shell or run 'exec \$SHELL' to load the new configuration."
          EOF

          chmod +x release/install.sh

      ##########################################################################
      # Create release README
      ##########################################################################

      - name: Create release README
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.new_tag }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          cat <<EOF > release/README.txt
          # Dotfiles with Bundled Chezmoi

          Release: v${RELEASE_VERSION}
          Platform: ${RELEASE_OS}/${RELEASE_ARCH}

          This archive contains:

          - chezmoi binary for ${RELEASE_OS}/${RELEASE_ARCH}
          - rendered dotfiles
          - .chezmoidata.yml, when present
          - install.sh

          ## Installation

          1. Extract this archive to a temporary directory.
          2. Run:

             ./install.sh

          3. Follow the prompts.

          ## Manual Installation

          If you prefer to install manually:

          1. Make chezmoi executable:

             chmod +x chezmoi

          2. Initialize chezmoi:

             ./chezmoi init --source dotfiles/

          3. Review what will be changed:

             ./chezmoi diff

          4. Apply the dotfiles:

             ./chezmoi apply

          ## Source

          GitHub: https://github.com/redjax/dotfiles
          EOF

      ##########################################################################
      # Verify the release contents before archiving
      ##########################################################################

      - name: Verify release contents
        shell: bash
        run: |
          set -euo pipefail

          echo "Release contents:"
          find release -type f -print | sort

          echo
          echo "Rendered shell files:"
          find release/dotfiles \
            -type f \
            \( \
              -name '*.sh' \
              -o -name '*.bash' \
              -o -name '*.zsh' \
              -o -name '*.ksh' \
              -o -name '*.bats' \
            \) \
            -print | sort

          echo
          echo "Release directory size:"
          du -sh release

      ##########################################################################
      # Archive the fully rendered and formatted release
      ##########################################################################

      - name: Create archives
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.new_tag }}
          OS_ARCH: ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          set -euo pipefail

          mkdir -p deploy

          cp -a release/. deploy/

          echo "Creating ZIP archive..."
          zip \
            --recurse-paths \
            "dotfiles-${OS_ARCH}-v${VERSION}.zip" \
            deploy

          echo "Creating TAR.GZ archive..."
          tar \
            --create \
            --gzip \
            --file "dotfiles-${OS_ARCH}-v${VERSION}.tar.gz" \
            deploy

          echo
          echo "Created archives:"
          ls -lh \
            "dotfiles-${OS_ARCH}-v${VERSION}.zip" \
            "dotfiles-${OS_ARCH}-v${VERSION}.tar.gz"

      ##########################################################################
      # Upload archives for the release job
      ##########################################################################

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - setup
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Show release artifacts
        shell: bash
        run: |
          set -euo pipefail

          find artifacts -type f -maxdepth 2 -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.setup.outputs.new_tag }}
          name: v${{ needs.setup.outputs.new_tag }}
          generate_release_notes: true
          files: artifacts/*
