---
name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-templates:
    name: Validate templates
    uses: ./.github/workflows/validate-templates.yml

  validate-scripts:
    name: Validate scripts
    uses: ./.github/workflows/validate-scripts.yml

  renovate-gate:
    name: Renovate Gate
    runs-on: ubuntu-latest
    needs:
      - validate-templates
      - validate-scripts

    steps:
      - name: Renovate gate
        run: echo "Indicate success to Renovate to enable auto-merging."
