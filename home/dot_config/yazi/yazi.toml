#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 4, 3]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
wrap = "no"
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[tasks]
bizarre_retry = 3
image_alloc = 536870912
image_bound = [5000, 5000]
suppress_preload = false

[plugin]

[[plugin.prepend_fetchers]]
url = "local://*"
run = "mime-ext.local"
prio = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url = "remote://*"
run = "mime-ext.remote"
prio = "high"
group = "mime"

